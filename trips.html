<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lilith · Trips</title>
    <link rel="icon" type="image/png" href="tesla.png">

    <link rel="stylesheet" href="trips.css?v=20260823-2">

    <style>
        /*
         * Zeitraum-Auswahl
         *
         * Absichtlich hier im HTML, damit trips.css
         * zunächst nicht geändert werden muss.
         */

        .range-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 10px;

            margin: 0 0 16px 0;
        }

        .range-label {
            font-size: 13px;
            opacity: 0.7;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .range-select {
            appearance: none;
            -webkit-appearance: none;

            background: rgba(0, 0, 0, 0.65);
            color: #fff;

            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 6px;

            padding: 8px 34px 8px 12px;

            font-size: 14px;

            cursor: pointer;

            background-image:
                linear-gradient(45deg, transparent 50%, #fff 50%),
                linear-gradient(135deg, #fff 50%, transparent 50%);

            background-position:
                calc(100% - 15px) 50%,
                calc(100% - 10px) 50%;

            background-size:
                5px 5px,
                5px 5px;

            background-repeat: no-repeat;
        }

        .range-select:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.6);
        }

        .stats {
            grid-template-columns: repeat(4, 1fr);
        }

        @media (max-width: 600px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .consumption-trend {
            margin: -18px 0 35px;
            padding: 18px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            backdrop-filter: blur(8px);
        }

        .consumption-trend-header,
        .trip-map-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            color: var(--muted);
            font-size: 0.65rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .consumption-chart {
            display: block;
            width: 100%;
            height: 150px;
            overflow: visible;
        }

        .consumption-chart-grid {
            stroke: rgba(255, 255, 255, 0.1);
            stroke-width: 1;
        }

        .consumption-chart-line {
            fill: none;
            stroke: var(--bright-red);
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 5px rgba(255, 26, 26, 0.65));
        }

        .consumption-chart-dot {
            fill: #000;
            stroke: var(--bright-red);
            stroke-width: 2;
        }

        .consumption-chart-label {
            fill: var(--muted);
            font-size: 10px;
        }

        .trip-map {
            padding: 15px 20px 18px;
            border-top: 1px solid rgba(255,255,255,0.07);
        }

        .trip-map-toggle {
            padding: 7px 10px;
            color: #fff;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 6px;
            cursor: pointer;
        }

        .trip-map-canvas {
            display: block;
            width: 100%;
            height: 220px;
            border-radius: 8px;
            background:
                linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px),
                #090909;
            background-size: 24px 24px;
        }

        .trip-map-line {
            stroke: var(--bright-red);
            stroke-width: 3;
            stroke-dasharray: 7 5;
        }

        .trip-map-point {
            fill: #000;
            stroke: var(--bright-red);
            stroke-width: 3;
        }

        .trip-map-label {
            fill: #fff;
            font-size: 12px;
        }
    </style>
</head>

<body>

<script>

/*
 * ============================================================
 * DATENQUELLE
 * ============================================================
 */

const API_URL =
    "/api/tesla/trips";

const CHARGING_API_URL =
    "/api/tesla/charging";

const CHARGING_CURVE_API_URL =
    "/api/tesla/charging/curve";


/*
 * ============================================================
 * ZEITRAUM
 * ============================================================
 */

let selectedDays = "31";
let allHistoryPromise = null;


/*
 * ============================================================
 * ORTSNAMEN AUFBEREITEN
 * ============================================================
 *
 * Die Datenbank bleibt unverändert.
 *
 * Beispiel:
 *
 * Kopernikus-Straße, Oberhaus, Vöcklabruck,
 * Bezirk Vöcklabruck, Oberösterreich, 4840, Österreich
 *
 * wird angezeigt als:
 *
 * Kopernikus-Straße, Vöcklabruck, Österreich
 *
 */

function formatLocationName(name, street, houseNumber, city, country) {

    // ============================================================
    // 1. Bevorzugt: vollständige strukturierte Daten
    // ============================================================

    if (street && city) {

        const streetLine = [
            street,
            houseNumber
        ]
            .filter(Boolean)
            .join(" ");

        return [
            streetLine,
            city,
            country
        ]
            .filter(Boolean)
            .join(", ");
    }


    // ============================================================
    // 2. Fallback: vollständigen Nominatim-Namen auswerten
    //
    // Beispiel:
    // 20, Tiefenbach, Frankenburg am Hausruck,
    // Bezirk Vöcklabruck, Oberösterreich, 4871, Österreich
    //
    // wird zu:
    // Tiefenbach 20, Frankenburg am Hausruck, Österreich
    // ============================================================

    if (name) {

        const parts = String(name)
            .split(",")
            .map(part => part.trim())
            .filter(Boolean);

        if (parts.length >= 3) {

            let detectedHouseNumber = null;
            let detectedStreet = null;
            let detectedCity = null;
            let detectedCountry = null;


            // ----------------------------------------------------
            // Hausnummer
            // ----------------------------------------------------

            if (/^\d+[a-zA-Z]?$/.test(parts[0])) {
                detectedHouseNumber = parts[0];
            }


            // ----------------------------------------------------
            // Straße / Ortsteil
            // ----------------------------------------------------

            if (detectedHouseNumber && parts[1]) {
                detectedStreet = parts[1];
            }


            // ----------------------------------------------------
            // Ort
            // ----------------------------------------------------

            if (detectedHouseNumber && parts[2]) {
                detectedCity = parts[2];
            }


            // ----------------------------------------------------
            // Land = letzter Bestandteil
            // ----------------------------------------------------

            detectedCountry =
                parts[parts.length - 1];


            // ----------------------------------------------------
            // Ausgabe
            // ----------------------------------------------------

            if (detectedStreet && detectedCity) {

                const streetLine = [
                    detectedStreet,
                    detectedHouseNumber
                ]
                    .filter(Boolean)
                    .join(" ");

                return [
                    streetLine,
                    detectedCity,
                    detectedCountry
                ]
                    .filter(Boolean)
                    .join(", ");
            }
        }


        // Wenn der Nominatim-String nicht erkannt wird:
        // Original unverändert anzeigen
        return name;
    }


    // ============================================================
    // 3. Letzter Fallback
    // ============================================================

    const fallbackStreet = [
        street,
        houseNumber
    ]
        .filter(Boolean)
        .join(" ");

    const fallback = [
        fallbackStreet,
        city,
        country
    ]
        .filter(Boolean)
        .join(", ");

    return fallback || "Unbekannt";
}
/*
 * ============================================================
 * DATUM / ZEIT
 * ============================================================
 */

function formatDate(dateString) {

    const date =
        new Date(dateString);


    return date.toLocaleDateString(
        "de-AT",
        {
            weekday: "long",
            day: "2-digit",
            month: "long",
            year: "numeric"
        }
    );
}


function formatTime(dateString) {

    const date =
        new Date(dateString);


    return date.toLocaleTimeString(
        "de-AT",
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );
}


/*
 * ============================================================
 * DAUER
 * ============================================================
 */

function formatDuration(seconds) {

    const minutes =
        Math.round(
            Number(seconds || 0) / 60
        );


    const hours =
        Math.floor(
            minutes / 60
        );


    const mins =
        minutes % 60;


    if (hours > 0) {

        return `${hours}h ${String(mins).padStart(2, "0")}min`;
    }


    return `${mins} min`;
}


/*
 * ============================================================
 * ZAHLEN
 * ============================================================
 */

function formatNumber(
    value,
    decimals = 1
) {

    const number =
        Number(value);


    if (!Number.isFinite(number)) {

        return "–";
    }


    return number.toLocaleString(
        "de-AT",
        {
            minimumFractionDigits:
                decimals,

            maximumFractionDigits:
                decimals
        }
    );
}


function getTripCoordinates(trip, prefix) {
    const rawLatitude =
        trip[`${prefix}_latitude`] ??
        trip[`${prefix}_lat`] ??
        trip[`${prefix}_location_latitude`] ??
        trip[`${prefix}_location_lat`];

    const rawLongitude =
        trip[`${prefix}_longitude`] ??
        trip[`${prefix}_lon`] ??
        trip[`${prefix}_lng`] ??
        trip[`${prefix}_location_longitude`] ??
        trip[`${prefix}_location_lon`];

    if (rawLatitude === null || rawLatitude === undefined || rawLatitude === "" ||
        rawLongitude === null || rawLongitude === undefined || rawLongitude === "") {
        return null;
    }

    const latitude = Number(rawLatitude);
    const longitude = Number(rawLongitude);

    return Number.isFinite(latitude) &&
        Number.isFinite(longitude) &&
        Math.abs(latitude) <= 90 &&
        Math.abs(longitude) <= 180
            ? { latitude, longitude }
            : null;
}


function renderConsumptionTrend(trips) {
    const container = document.getElementById("consumptionTrend");
    const daily = new Map();

    trips.forEach(trip => {
        const date = new Date(trip.end_time || trip.start_time || 0);
        const distance = Number(trip.distance_km || 0);
        const energy = Number(trip.consumed_kwh || 0);

        if (!Number.isFinite(date.getTime()) || distance <= 0 || energy < 0) {
            return;
        }

        const key = date.toLocaleDateString("sv-SE");
        const current = daily.get(key) || { date, distance: 0, energy: 0 };
        current.distance += distance;
        current.energy += energy;
        daily.set(key, current);
    });

    const points = Array.from(daily.values())
        .sort((a, b) => a.date - b.date)
        .slice(-14)
        .map(point => ({
            ...point,
            consumption: (point.energy / point.distance) * 100
        }));

    if (points.length === 0) {
        container.innerHTML = `
            <div class="consumption-trend-header"><span>Verbrauch pro Tag</span><span>–</span></div>
            <div class="message">Keine Verbrauchsdaten vorhanden.</div>
        `;
        return;
    }

    const width = 760;
    const height = 130;
    const padding = { top: 12, right: 18, bottom: 24, left: 38 };
    const values = points.map(point => point.consumption);
    const minValue = Math.max(0, Math.floor(Math.min(...values) - 2));
    const maxValue = Math.ceil(Math.max(...values) + 2);
    const valueRange = Math.max(1, maxValue - minValue);
    const x = index => padding.left +
        (points.length === 1
            ? (width - padding.left - padding.right) / 2
            : index * (width - padding.left - padding.right) / (points.length - 1));
    const y = value => padding.top +
        (maxValue - value) * (height - padding.top - padding.bottom) / valueRange;
    const path = points.map((point, index) =>
        `${index === 0 ? "M" : "L"} ${x(index).toFixed(2)} ${y(point.consumption).toFixed(2)}`
    ).join(" ");
    const firstDate = points[0].date.toLocaleDateString("de-AT", { day: "2-digit", month: "2-digit" });
    const lastDate = points[points.length - 1].date.toLocaleDateString("de-AT", { day: "2-digit", month: "2-digit" });

    container.innerHTML = `
        <div class="consumption-trend-header">
            <span>Verbrauch pro Tag</span>
            <span>${formatNumber(values[values.length - 1])} kWh / 100 km</span>
        </div>
        <svg class="consumption-chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="Verbrauchskurve der letzten Tage">
            <line class="consumption-chart-grid" x1="${padding.left}" y1="${y(maxValue)}" x2="${width - padding.right}" y2="${y(maxValue)}"></line>
            <line class="consumption-chart-grid" x1="${padding.left}" y1="${y(minValue)}" x2="${width - padding.right}" y2="${y(minValue)}"></line>
            <text class="consumption-chart-label" x="0" y="${y(maxValue) + 4}">${formatNumber(maxValue, 0)}</text>
            <text class="consumption-chart-label" x="0" y="${y(minValue) + 4}">${formatNumber(minValue, 0)}</text>
            <path class="consumption-chart-line" d="${path}"></path>
            ${points.map((point, index) => `
                <circle class="consumption-chart-dot" cx="${x(index)}" cy="${y(point.consumption)}" r="4">
                    <title>${point.date.toLocaleDateString("de-AT")}: ${formatNumber(point.consumption)} kWh / 100 km</title>
                </circle>
            `).join("")}
            <text class="consumption-chart-label" x="${padding.left}" y="${height - 3}">${firstDate}</text>
            <text class="consumption-chart-label" x="${width - padding.right}" y="${height - 3}" text-anchor="end">${lastDate}</text>
        </svg>
    `;
}


/*
 * ============================================================
 * TRIPS RENDERN
 * ============================================================
 */

function renderHistory(trips, chargingSessions, allTrips, allChargingSessions) {

    const container =
        document.getElementById(
            "tripContainer"
        );


    const safeTrips =
        Array.isArray(trips)
            ? trips
            : [];

    const safeChargingSessions =
        Array.isArray(chargingSessions)
            ? chargingSessions
            : [];


    // ========================================================
    // STATISTIK - weiterhin reine Fahrstatistik
    // ========================================================

    const totalDistance =
        safeTrips.reduce(
            (sum, trip) =>
                sum + Number(trip.distance_km || 0),
            0
        );

    const totalEnergy =
        safeTrips.reduce(
            (sum, trip) =>
                sum + Number(trip.consumed_kwh || 0),
            0
        );

    const averageConsumption =
        totalDistance > 0
            ? (totalEnergy / totalDistance) * 100
            : 0;

    const completeTrips = Array.isArray(allTrips) ? allTrips : safeTrips;
    const completeChargingSessions = Array.isArray(allChargingSessions)
        ? allChargingSessions
        : safeChargingSessions;

    const latestChargingTime =
        completeChargingSessions.reduce(
            (latest, session) => {
                const timestamp = new Date(
                    session.end_time ||
                    session.start_time ||
                    0
                ).getTime();

                return Number.isFinite(timestamp)
                    ? Math.max(latest, timestamp)
                    : latest;
            },
            0
        );

    const distanceSinceLastCharge =
        latestChargingTime > 0
            ? completeTrips.reduce(
                (sum, trip) => {
                    const tripTime = new Date(
                        trip.end_time ||
                        trip.start_time ||
                        0
                    ).getTime();

                    return Number.isFinite(tripTime) &&
                        tripTime > latestChargingTime
                            ? sum + Number(trip.distance_km || 0)
                            : sum;
                },
                0
            )
            : null;


    document.getElementById(
        "totalTrips"
    ).textContent =
        safeTrips.length;

    document.getElementById(
        "totalDistance"
    ).textContent =
        formatNumber(totalDistance);

    document.getElementById(
        "averageConsumption"
    ).textContent =
        formatNumber(averageConsumption);

    document.getElementById(
        "distanceSinceLastCharge"
    ).textContent =
        distanceSinceLastCharge === null
            ? "–"
            : formatNumber(distanceSinceLastCharge);

    renderConsumptionTrend(safeTrips);


    // ========================================================
    // TRIPS + LADEVORGÄNGE ZUSAMMENFÜHREN
    // ========================================================

    const history = [
        ...safeTrips.map(trip => ({
            history_type: "trip",
            sort_time:
                trip.end_time ||
                trip.start_time,
            data: trip
        })),

        ...safeChargingSessions.map(session => ({
            history_type: "charging",
            sort_time:
                session.end_time ||
                session.start_time,
            data: session
        }))
    ];


    history.sort(
        (a, b) =>
            new Date(b.sort_time || 0) -
            new Date(a.sort_time || 0)
    );


    if (history.length === 0) {

        container.innerHTML = `
            <div class="message">
                Keine Fahrten oder Ladevorgänge im gewählten Zeitraum vorhanden.
            </div>
        `;

        return;
    }


    // ========================================================
    // NACH TAGEN GRUPPIEREN
    // ========================================================

    const groups = {};

    history.forEach(item => {

        if (!item.sort_time) {
            return;
        }

        const key =
            new Date(item.sort_time)
                .toLocaleDateString("de-AT");

        if (!groups[key]) {
            groups[key] = [];
        }

        groups[key].push(item);
    });


    container.innerHTML = "";


    Object.values(groups).forEach(dayItems => {

        const section =
            document.createElement("section");

        section.className =
            "day";


        const title =
            document.createElement("div");

        title.className =
            "day-title";

        title.textContent =
            formatDate(
                dayItems[0].sort_time
            );

        section.appendChild(title);


        dayItems.forEach(item => {

            if (item.history_type === "charging") {

                section.appendChild(
                    createChargingCard(item.data)
                );

            } else {

                section.appendChild(
                    createTripCard(item.data)
                );
            }
        });


        container.appendChild(section);
    });
}


/*
 * ============================================================
 * TRIP CARD
 * ============================================================
 */

function createTripCard(trip) {

    const card =
        document.createElement(
            "article"
        );


    card.className =
        "trip";


    /*
     * Start-/Endzeit
     */

    const startDate =

        trip.start_time

            ? new Date(
                trip.start_time
            )

            : null;


    const endDate =

        trip.end_time

            ? new Date(
                trip.end_time
            )

            : null;


    /*
     * Dauer:
     *
     * Wenn duration_seconds aus der DB vorhanden ist,
     * verwenden wir diesen Wert.
     *
     * Dadurch funktioniert die Anzeige auch,
     * wenn alte Datensätze kein start_time besitzen.
     */

    let durationSeconds =
        Number(
            trip.duration_seconds || 0
        );


    if (
        durationSeconds <= 0 &&
        startDate &&
        endDate
    ) {

        durationSeconds =
            (
                endDate -
                startDate
            ) / 1000;
    }


    /*
     * Batterie
     */

    const batteryUsed =

        Number(
            trip.used_battery_pct
        )

        ||

        (
            Number(
                trip.start_battery_pct || 0
            )

            -

            Number(
                trip.end_battery_pct || 0
            )
        );


const batteryStart =
    Math.max(
        0,
        Math.min(
            100,
            Number(trip.start_battery_pct || 0)
        )
    );

const batteryEnd =
    Math.max(
        0,
        Math.min(
            100,
            Number(trip.end_battery_pct || 0)
        )
    );

const batteryLeft =
    Math.min(
        batteryStart,
        batteryEnd
    );

const batteryWidth =
    Math.abs(
        batteryStart -
        batteryEnd
    );

const batteryDirection =
    batteryEnd >= batteryStart
        ? "charging"
        : "discharging";
    /*
     * Ortsnamen nur für Anzeige aufbereiten.
     *
     * Die Originalwerte aus der DB bleiben unangetastet.
     */

    const startLocation =

formatLocationName(
    trip.start_location_name,
    trip.start_street,
    trip.start_house_number,
    trip.start_city,
    trip.start_country
);

    const endLocation =

formatLocationName(
    trip.end_location_name,
    trip.end_street,
    trip.end_house_number,
    trip.end_city,
    trip.end_country
);

    /*
     * Zeit anzeigen
     */

    const startTime =

        trip.start_time

            ? formatTime(
                trip.start_time
            )

            : "–";


    const endTime =

        trip.end_time

            ? formatTime(
                trip.end_time
            )

            : "–";

    const startCoordinates = getTripCoordinates(trip, "start");
    const endCoordinates = getTripCoordinates(trip, "end");
    const hasMap = startCoordinates && endCoordinates;
    const latitudeDifference = hasMap
        ? endCoordinates.latitude - startCoordinates.latitude
        : 0;
    const longitudeDifference = hasMap
        ? endCoordinates.longitude - startCoordinates.longitude
        : 0;
    const mapEndX = 210 + Math.max(-130, Math.min(130, longitudeDifference * 1800));
    const mapEndY = 110 - Math.max(-70, Math.min(70, latitudeDifference * 1800));
    const mapMarkup = hasMap
        ? `
            <div class="trip-map">
                <div class="trip-map-header">
                    <span>Schematische Route</span>
                    <button type="button" class="trip-map-toggle" aria-expanded="false">Karte anzeigen</button>
                </div>
                <svg class="trip-map-canvas" viewBox="0 0 420 220" role="img" aria-label="Start- und Zielposition" hidden>

/*
 * ============================================================
 * CHARGING CARD
 * ============================================================
 */

function createChargingCard(session) {

    const card =
        document.createElement("article");

    const chargeType =
        String(session.charge_type || "unknown")
            .toUpperCase();

    const typeClass =
        chargeType === "DC"
            ? "charge-dc"
            : "charge-ac";

    const batteryColor =
        chargeType === "DC"
            ? "#ffd43b"
            : "#38c172";

    const batteryGlow =
        chargeType === "DC"
            ? "rgba(255, 212, 59, 0.6)"
            : "rgba(56, 193, 114, 0.6)";

    card.className =
        `trip charging-card ${typeClass}`;


    const batteryStart =
        Math.max(
            0,
            Math.min(
                100,
                Number(session.start_battery_pct || 0)
            )
        );

    const batteryEnd =
        Math.max(
            0,
            Math.min(
                100,
                Number(session.end_battery_pct || 0)
            )
        );

    const batteryLeft =
        Math.min(
            batteryStart,
            batteryEnd
        );

    const batteryWidth =
        Math.abs(
            batteryEnd - batteryStart
        );


    const startTime =
        session.start_time
            ? formatTime(session.start_time)
            : "–";

    const endTime =
        session.end_time
            ? formatTime(session.end_time)
            : "–";


    const chargedBatteryPct =
        Number(session.charged_battery_pct || 0);


    card.innerHTML = `

        <div class="charge-main">

            <div>
                <div class="charge-heading">
                    <span class="charge-dot"></span>
                    <span>${chargeType} LADEN</span>
                </div>

                <div class="charge-time">
                    ${startTime} → ${endTime}
                </div>
            </div>

            <div class="charge-type">
                ${chargeType}
            </div>

        </div>


        <div class="metrics">

            <div class="metric">
                <div class="metric-value">
                    ${formatDuration(session.duration_seconds)}
                </div>
                <div class="metric-label">
                    Dauer
                </div>
            </div>

            <div class="metric">
                <div class="metric-value">
                    ${formatNumber(session.charged_energy_kwh, 2)}
                </div>
                <div class="metric-label">
                    kWh geladen
                </div>
            </div>

            <div class="metric">
                <div class="metric-value">
                    ${formatNumber(session.max_power_kw, 1)}
                </div>
                <div class="metric-label">
                    Max kW
                </div>
            </div>

            <div class="metric">
                <div class="metric-value">
                    ${formatNumber(session.end_outside_temp_c, 1)}°
                </div>
                <div class="metric-label">
                    Außen
                </div>
            </div>

        </div>


        <div class="battery">

            <div class="battery-header">

                <span>
                    BATTERIE
                </span>

                <span>
                    ${formatNumber(session.start_battery_pct, 0)} %
                    →
                    ${formatNumber(session.end_battery_pct, 0)} %
                    &nbsp;
                    (+${formatNumber(chargedBatteryPct, 1)} %)
                </span>

            </div>

            <div class="battery-bar">
                <div
                    class="battery-range ${typeClass}"
                    style="left:${batteryLeft}%; width:${batteryWidth}%; background:${batteryColor}; box-shadow:0 0 5px ${batteryGlow};"
                ></div>
            </div>

        </div>
    `;


    if (session.session_id) {
        const curveSection = document.createElement("div");
        curveSection.className = "charge-curve-section";
        curveSection.innerHTML = `
            <button type="button" class="charge-curve-toggle" aria-expanded="false">
                <span>Ladekurve anzeigen</span>
                <span class="charge-curve-chevron">⌄</span>
            </button>
            <div class="charge-curve-content" hidden>
                <div class="charge-curve-message">Ladekurve wird geladen ...</div>
            </div>
        `;
        card.appendChild(curveSection);

        const toggle = curveSection.querySelector(".charge-curve-toggle");
        const content = curveSection.querySelector(".charge-curve-content");

        toggle.addEventListener("click", async () => {
            const open = toggle.getAttribute("aria-expanded") === "true";
            if (open) {
                toggle.setAttribute("aria-expanded", "false");
                toggle.querySelector("span").textContent = "Ladekurve anzeigen";
                content.hidden = true;
                return;
            }

            toggle.setAttribute("aria-expanded", "true");
            toggle.querySelector("span").textContent = "Ladekurve ausblenden";
            content.hidden = false;
            if (content.dataset.loaded === "true") return;

            try {
                const response = await fetch(
                    `${CHARGING_CURVE_API_URL}?session_id=${encodeURIComponent(session.session_id)}`,
                    { cache: "no-store" }
                );
                if (!response.ok) throw new Error(`Curve API HTTP ${response.status}`);
                const data = await response.json();
                renderChargeCurve(content, Array.isArray(data.points) ? data.points : [], chargeType);
                content.dataset.loaded = "true";
            } catch (error) {
                console.error("Charging Curve API Fehler:", error);
                content.innerHTML = `<div class="charge-curve-message">Ladekurve konnte nicht geladen werden.</div>`;
            }
        });
    }


    return card;
}


/*
 * ============================================================
 * LADEKURVE
 * ============================================================
 */

function renderChargeCurve(container, rawPoints, chargeType) {
    const points = rawPoints
        .map(p => ({ soc:Number(p.soc_pct), kw:Number(p.power_kw), elapsed:Number(p.elapsed_seconds) }))
        .filter(p => Number.isFinite(p.soc) && Number.isFinite(p.kw))
        .sort((a,b) => a.elapsed-b.elapsed);

    if (points.length < 2) {
        container.innerHTML = `<div class="charge-curve-message">Noch nicht genügend Daten für eine Ladekurve.</div>`;
        return;
    }

    const W=900, H=300, P={l:58,r:22,t:22,b:42};
    const pw=W-P.l-P.r, ph=H-P.t-P.b;

    let minSoc=Math.floor(Math.min(...points.map(p=>p.soc)));
    let maxSoc=Math.ceil(Math.max(...points.map(p=>p.soc)));
    if (maxSoc-minSoc < 5) {
        const c=(minSoc+maxSoc)/2;
        minSoc=Math.max(0,Math.floor(c-2.5));
        maxSoc=Math.min(100,Math.ceil(c+2.5));
    }
    if (maxSoc<=minSoc) maxSoc=Math.min(100,minSoc+1);

    const measuredMax=Math.max(...points.map(p=>p.kw),1);
    const yStep=measuredMax<=25?5:measuredMax<=100?20:50;
    const maxKw=Math.ceil(measuredMax/yStep)*yStep;

    const x=s=>P.l+((s-minSoc)/(maxSoc-minSoc))*pw;
    const y=k=>P.t+ph-(Math.max(0,k)/maxKw)*ph;
    const color=chargeType==="DC"?"#ffd43b":"#38c172";
    const path=points.map((p,i)=>`${i?"L":"M"} ${x(p.soc).toFixed(2)} ${y(p.kw).toFixed(2)}`).join(" ");

    let grid="";
    for(let v=0;v<=maxKw;v+=yStep){
        const yy=y(v);
        grid+=`<line x1="${P.l}" y1="${yy}" x2="${W-P.r}" y2="${yy}" class="curve-grid-line"/>
        <text x="${P.l-10}" y="${yy+4}" text-anchor="end" class="curve-axis-text">${v}</text>`;
    }

    const span=maxSoc-minSoc, xStep=span<=10?2:span<=30?5:10;
    for(let v=Math.ceil(minSoc/xStep)*xStep;v<=maxSoc;v+=xStep){
        const xx=x(v);
        grid+=`<line x1="${xx}" y1="${P.t}" x2="${xx}" y2="${H-P.b}" class="curve-grid-line curve-grid-line-vertical"/>
        <text x="${xx}" y="${H-15}" text-anchor="middle" class="curve-axis-text">${v}%</text>`;
    }

    const peak=points.reduce((a,p)=>p.kw>a.kw?p:a,points[0]);

    container.innerHTML=`
        <div class="charge-curve-summary">
            <span>${points.length} Messpunkte</span>
            <span>Peak ${formatNumber(peak.kw,1)} kW bei ${formatNumber(peak.soc,1)} %</span>
        </div>
        <div class="charge-curve-chart">
            <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ladekurve">
                ${grid}
                <line x1="${P.l}" y1="${P.t}" x2="${P.l}" y2="${H-P.b}" class="curve-axis-line"/>
                <line x1="${P.l}" y1="${H-P.b}" x2="${W-P.r}" y2="${H-P.b}" class="curve-axis-line"/>
                <text x="16" y="${P.t+ph/2}" transform="rotate(-90 16 ${P.t+ph/2})" text-anchor="middle" class="curve-axis-label">kW</text>
                <text x="${P.l+pw/2}" y="${H-2}" text-anchor="middle" class="curve-axis-label">SOC</text>
                <path d="${path}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
            </svg>
        </div>`;
}


/*
 * ============================================================
 * DATEN LADEN
 * ============================================================
 */

async function loadHistory() {

    document.getElementById(
        "tripContainer"
    ).innerHTML = `
        <div class="message">
            Lade Fahrten und Ladevorgänge ...
        </div>
    `;


    try {

        const encodedDays =
            encodeURIComponent(selectedDays);

        const tripUrl =
            `${API_URL}?days=${encodedDays}`;

        const chargingUrl =
            `${CHARGING_API_URL}?days=${encodedDays}`;


        if (!allHistoryPromise) {
            allHistoryPromise = Promise.all([
                fetch(`${API_URL}?days=all`, { cache: "no-store" }),
                fetch(`${CHARGING_API_URL}?days=all`, { cache: "no-store" })
            ]).then(async ([allTripResponse, allChargingResponse]) => {
                if (!allTripResponse.ok || !allChargingResponse.ok) {
                    throw new Error("Vollständige History konnte nicht geladen werden");
                }

                const allTripData = await allTripResponse.json();
                const allChargingData = await allChargingResponse.json();
                return {
                    trips: Array.isArray(allTripData) ? allTripData : (allTripData.trips || []),
                    chargingSessions: Array.isArray(allChargingData)
                        ? allChargingData
                        : (allChargingData.charging_sessions || [])
                };
            }).catch(error => {
                console.error("Vollständige History konnte nicht geladen werden:", error);
                return null;
            });
        }

        const [tripResponse, chargingResponse, completeHistory] =
            await Promise.all([
                fetch(tripUrl, { cache: "no-store" }),
                fetch(chargingUrl, { cache: "no-store" }),
                allHistoryPromise
            ]);


        if (!tripResponse.ok) {
            throw new Error(
                `Trip API HTTP ${tripResponse.status}`
            );
        }

        if (!chargingResponse.ok) {
            throw new Error(
                `Charging API HTTP ${chargingResponse.status}`
            );
        }


        const tripData =
            await tripResponse.json();

        const chargingData =
            await chargingResponse.json();


        const trips =
            Array.isArray(tripData)
                ? tripData
                : (tripData.trips || []);

        const chargingSessions =
            Array.isArray(chargingData)
                ? chargingData
                : (chargingData.charging_sessions || []);


        renderHistory(
            trips,
            chargingSessions,
            completeHistory?.trips,
            completeHistory?.chargingSessions
        );


    } catch (error) {

        console.error(
            "History API Fehler:",
            error
        );


        document.getElementById(
            "totalTrips"
        ).textContent = "–";

        document.getElementById(
            "totalDistance"
        ).textContent = "–";

        document.getElementById(
            "averageConsumption"
        ).textContent = "–";

        document.getElementById(
            "distanceSinceLastCharge"
        ).textContent = "–";

        document.getElementById(
            "consumptionTrend"
        ).innerHTML = `<div class="message">Verbrauchskurve konnte nicht geladen werden.</div>`;


        document.getElementById(
            "tripContainer"
        ).innerHTML = `
            <div class="message">
                Fahrten und Ladevorgänge konnten nicht geladen werden.
            </div>
        `;
    }
}

const rangeSelect =

rangeSelect.addEventListener(

        selectedDays =
